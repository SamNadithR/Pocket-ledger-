<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PocketPulse"><meta name="theme-color" content="#0F5257">
<title>PocketPulse - Finance & Target Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#F1F4EF;--card:#fff;--ink:#12212A;--mut:#64767B;--acc:#0F5257;--in:#1F7A45;--out:#C2452B;--line:#E1E7E2;--gold:#F4C95D;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1619;--card:#16242A;--ink:#E8F0EC;--mut:#8FA3A7;--acc:#5FC2B4;--in:#6CCB8D;--out:#F58B68;--line:#25373D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1619;--card:#16242A;--ink:#E8F0EC;--mut:#8FA3A7;--acc:#5FC2B4;--in:#6CCB8D;--out:#F58B68;--line:#25373D;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-bottom:110px}
main{max-width:560px;margin:0 auto;padding:18px 16px}
h1,h2,.big{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
h1{font-size:32px;font-weight:800;line-height:1.1}
h2{font-size:19px;font-weight:600;margin:26px 0 10px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(18,33,42,.05)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.in{color:var(--in)}.out{color:var(--out)}
.wallets{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
.wc{flex:0 0 74%;scroll-snap-align:start;border-radius:24px;padding:18px;min-height:136px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.wc .big{font-size:28px;font-weight:800}.wc span{opacity:.85;font-size:14px}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px}
.g{display:flex;gap:14px;align-items:center}.g>div:nth-child(2){flex:1;min-width:0}
.gn{font-weight:600}.gp{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800}
.tx{padding:11px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.x{background:none;border:0;color:var(--mut);font-size:14px;padding:6px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:16px;padding:13px 18px;font-weight:600}
.sm{padding:9px 14px;border-radius:14px;font-size:14px}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.full{width:100%}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:4px 0 12px}
label{font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--card);border-radius:20px;padding:6px 6px 6px 14px;font-size:14px}
.chip button{background:none;border:0;color:var(--mut);padding:0 8px}
.add{display:flex;gap:8px}.add input{margin:0}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--card);border-radius:28px;box-shadow:0 8px 30px rgba(18,33,42,.18);display:grid;grid-template-columns:repeat(6,1fr);align-items:center;padding:8px 4px;z-index:30}
nav button{background:none;border:0;color:var(--mut);padding:8px 0;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--acc)}
nav .plus{background:var(--acc);color:#fff;border-radius:50%;width:46px;height:46px;font-size:26px;line-height:1;padding:0;margin:0 auto;box-shadow:0 6px 16px rgba(15,82,87,.4)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:40}
#sheet.open{display:flex}
#sheet>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.seg{display:flex;gap:6px;margin-bottom:14px;background:var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:12px;border:0;background:none;font-weight:600}
.seg button.on{background:var(--card);color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main id="v"></main>
<nav>
    <button data-tab="home"><span>🏠</span>Home</button>
    <button data-tab="goals"><span>🎯</span>Targets</button>
    <button class="plus" data-act="tx" aria-label="Add transaction">+</button>
    <button data-tab="wallets"><span>💳</span>Wallets</button>
    <button data-tab="reports"><span>📊</span>Reports</button>
    <button data-tab="ai"><span>✨</span>Gemini AI</button>
</nav>
<div id="sheet"><div id="sb"></div></div>

<script>
const $=s=>document.querySelector(s), K="pocketpulse-v2";
const WC=["#0F5257","#9A5B0F","#C2452B","#3B4BA6","#5B3F8C","#1F7A45"];
const pad=n=>String(n).padStart(2,"0"), dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const td=()=>dstr(new Date()), uid=()=>Math.random().toString(36).slice(2,9);
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(n, cur="LKR")=> cur==="USD" ? "$ "+Number(n).toFixed(2) : "Rs "+Math.round(n).toLocaleString("en-US");

// Sampath Bank Board Rate for NRFC USD conversion to LKR
const USD_RATE = 328.50;

let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.wallets){
    S={
        wallets:[
            {id:uid(), name:"Delivery Cash", currency:"LKR", open:15000},
            {id:uid(), name:"Sampath NRFC", currency:"USD", open:120.50}
        ],
        cats:[
            ["Salary","i"],["Delivery","i"],["Rent","e"],["Food & Transport","e"],["Mobile","e"],["Loan","e"],["Fuel","e"]
        ].map(x=>({id:uid(), name:x[0], t:x[1]})),
        tx:[
            {id:uid(), t:"i", a:45000, w:S?S.wallets[0]?.id:"", cn:"Delivery", d:td(), n:"Weekly payout"}
        ],
        goals:[
            {id:uid(), name:"Second-hand Camera Body", target:90000, due:plus(45), c:[]}
        ]
    }
}
S.goals.forEach(g=>{g.c=g.c||[]});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab="home", armed=null;

// Calculate wallet balance
const bal=wId=>{
    const W=S.wallets.find(x=>x.id==wId);
    if(!W) return 0;
    let b=W.open;
    S.tx.forEach(t=>{
        if(t.t=="i"&&t.w==wId) b+=t.a;
        if(t.t=="e"&&t.w==wId) b-=t.a;
        if(t.t=="t"){
            if(t.w==wId) b-=t.a;
            if(t.w2==wId) b+=t.a;
        }
    });
    // Deduct contributions made from this wallet towards targets
    S.goals.forEach(g=>g.c.forEach(x=>{if(x.w==wId) b-=x.a}));
    return b;
};

// Convert wallet balance to LKR equivalent for net worth summary
const balInLkr=w=>{
    const b = bal(w.id);
    return w.currency === "USD" ? b * USD_RATE : b;
};

const wname=id=>(S.wallets.find(w=>w.id==id)||{name:"No wallet"}).name;
const daysLeft=d=>Math.round((new Date(d+"T00:00")-new Date(td()+"T00:00"))/864e5)+1;
const saved=g=>g.c.reduce((s,x)=>s+x.a,0);

// Target Card Template
function gcard(g,full){
    const sv=saved(g), rem=Math.max(0,g.target-sv), dl=daysLeft(g.due), per=dl>0?rem/dl:rem, pct=Math.min(100,sv/g.target*100);
    const today=g.c.filter(x=>x.d==td()).reduce((s,x)=>s+x.a,0);
    let h=`<div class="card"><div class="g"><div class="ring" style="--p:${pct}"><b>${Math.round(pct)}%</b></div><div><div class="gn">${esc(g.name)}</div>
    <div class="gp">${rem==0?"Goal reached":fmt(per)+" / day"}</div><div class="mut">${rem==0?"Target fully funded":(dl>0?dl+" day"+(dl>1?"s":"")+" left":"Deadline passed")+" · by "+g.due}</div></div>
    <button class="btn sm" data-act="fund" data-id="${g.id}">+ Add</button></div>`;
    if(full){
        h+=`<div class="row" style="margin-top:14px"><span class="mut">${fmt(sv)} of ${fmt(g.target)}</span><span class="mut">Today ${fmt(today)}${rem>0?" / "+fmt(per):""}</span></div><h2 style="font-size:15px;margin:14px 0 4px">Contributions</h2>`+
        (g.c.length?g.c.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<div class="tx row"><div>${fmt(x.a)}<div class="mut">${x.d} · from ${esc(wname(x.w))}</div></div><button class="x" data-act="delc" data-id="${g.id}" data-c="${x.id}" aria-label="Delete">✕</button></div>`).join(""):`<div class="mut">None yet. Tap Add to put money toward this target.</div>`)+
        `<div style="text-align:right"><button class="x" data-act="delgoal" data-id="${g.id}">${armed==g.id?"Tap again to delete":"Remove target"}</button></div>`
    }
    return h+"</div>";
}

// TAB 1: HOME
function home(){
    const totLkr = S.wallets.reduce((s,w)=>s+balInLkr(w), 0);
    const monthlyIncome = S.tx.filter(t=>t.t=="i").reduce((s,t)=>s+t.a, 0);
    const monthlyExpense = S.tx.filter(t=>t.t=="e").reduce((s,t)=>s+t.a, 0);

    let h=`<div class="mut">Total Net Worth (LKR)</div><h1>${fmt(totLkr)}</h1>
    <div class="card" style="background:var(--card); margin-top:12px">
        <div class="row text-sm">
            <div><span class="mut">Fixed Expenses:</span> <br><b>Rs 62,000</b> (Rent 9k + Food/Trans 30k + Mobile 3k + Loan 20k)</div>
            <div style="text-align:right"><span class="mut">USD Rate:</span> <br><b>Rs ${USD_RATE}</b></div>
        </div>
    </div>
    
    <div class="wallets">`+
    S.wallets.map((w,i)=>`<div class="wc" style="background:${WC[i%WC.length]}"><span>${esc(w.name)} (${w.currency})</span><div class="big">${fmt(bal(w.id), w.currency)}</div></div>`).join("")+
    `</div><h2>Camera Fund Target</h2>`;
    
    h+=S.goals.length?S.goals.map(g=>gcard(g,false)).join(""):`<div class="mut">No targets yet.</div>`;
    
    h+=`<h2>Recent Transactions</h2><div class="card">`;
    const L=S.tx.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id.localeCompare(a.id)).slice(0,10);
    h+=L.length?L.map(t=>`<div class="tx row"><div>${esc(t.t=="t"?"Transfer":t.cn||"Other")}<div class="mut">${t.t=="t"?esc(wname(t.w))+" to "+esc(wname(t.w2)):esc(wname(t.w))} · ${t.d}${t.n?" · "+esc(t.n):""}</div></div>
    <div class="row"><b class="${t.t=="i"?"in":t.t=="e"?"out":""}">${t.t=="e"?"-":t.t=="i"?"+":""}${fmt(t.a)}</b><button class="x" data-act="deltx" data-id="${t.id}" aria-label="Delete">✕</button></div></div>`).join(""):`<span class="mut">No transactions yet. Tap + to add.</span>`;
    return h+"</div>";
}

// TAB 2: TARGETS
function goals(){
    return `<h1>Targets</h1><p class="mut">Add money to your camera fund gradually from your delivery earnings. The daily required average updates instantly.</p>`+
    S.goals.map(g=>gcard(g,true)).join("")+
    `<button class="btn full" data-act="goal" style="margin-top:12px">New Target</button>`;
}

// TAB 3: WALLETS (Separated tab with add/remove)
function wal(){
    let h=`<h1>Wallets</h1><p class="mut">Manage all your cash pots and bank accounts (including Sampath NRFC USD).</p>`;
    S.wallets.forEach((w,i)=>{
        const b = bal(w.id);
        h+=`<div class="card row" style="border-left:8px solid ${WC[i%WC.length]}">
            <div>
                <b>${esc(w.name)}</b> <span class="mut">(${w.currency})</span>
                <div class="big" style="font-size:22px">${fmt(b, w.currency)}</div>
                ${w.currency === 'USD' ? `<div class="mut" style="font-size:12px">≈ Rs ${Math.round(b * USD_RATE).toLocaleString()}</div>` : ''}
            </div>
            <button class="x" data-act="delwal" data-id="${w.id}">${armed==w.id?"Tap again to delete":"Remove"}</button>
        </div>`;
    });
    return h+`<button class="btn full" data-act="wallet" style="margin-top:12px">+ Add New Wallet</button>`;
}

// TAB 4: REPORTS & BALANCE SHEETS
function reports(){
    const totInc = S.tx.filter(t=>t.t=="i").reduce((s,t)=>s+t.a,0);
    const totExp = S.tx.filter(t=>t.t=="e").reduce((s,t)=>s+t.a,0);
    const fixedExp = 62000; // Rent 9k + Food 30k + Mobile 3k + Loan 20k

    setTimeout(() => renderChart(totInc, fixedExp, Math.max(0, totExp - fixedExp)), 50);

    return `<h1>Financial Reports</h1><p class="mut">Balance sheet summary and breakdown.</p>
    <div class="card space-y-3">
        <h3 style="margin:0 0 10px 0; font-size:16px">Balance Sheet</h3>
        <div class="row tx"><span>Total Inflows (Delivery/Other)</span><b class="in">Rs ${totInc.toLocaleString()}</b></div>
        <div class="row tx"><span>Fixed Outlays (Rent, Food, Loan, Mobile)</span><b class="out">Rs ${fixedExp.toLocaleString()}</b></div>
        <div class="row tx"><span>Other Recorded Expenses</span><b class="out">Rs ${Math.max(0, totExp - fixedExp).toLocaleString()}</b></div>
        <div class="row tx" style="font-size:18px"><b>Net Balance</b><b>Rs ${(totInc - totExp).toLocaleString()}</b></div>
    </div>
    <div class="card">
        <h3 style="margin:0 0 10px 0; font-size:16px">Income vs Expenses Chart</h3>
        <canvas id="repChart" height="200"></canvas>
    </div>`;
}

// TAB 5: GEMINI AI ADVISOR
function aiTab(){
    return `<h1>Gemini AI Advisor</h1><p class="mut">Your personal AI collaborator for Colombo delivery & budgeting.</p>
    <div class="card space-y-3">
        <div style="background:var(--bg); padding:12px; border-radius:14px; font-size:14px">
            🤖 <b>Gemini:</b> Hello Saminda! Your baseline fixed expenses are <b>Rs 62,000</b> (Rent: 9k, Food & Transport: 30k, Mobile: 3k, Loan: 20k). Focus on lunch (11 AM - 2 PM) and dinner peaks (5 PM - 9:30 PM) around Colombo 03/07 to accelerate your second-hand camera fund!
        </div>
        <div id="chatLog" style="max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; font-size:14px; padding:4px 0">
            <div style="background:var(--card); border:1px solid var(--line); padding:10px; border-radius:12px"><b>Tip:</b> Riding in the rain spikes order volume in Colombo, boosting your daily average!</div>
        </div>
        <div class="add">
            <input id="aiQ" placeholder="Ask AI anything (e.g., How to hit my camera target faster?)">
            <button class="btn sm" onclick="askAi()">Ask</button>
        </div>
    </div>`;
}

function askAi(){
    const input = $("#aiQ");
    const log = $("#chatLog");
    if(!input || !input.value.trim()) return;
    const q = input.value;
    log.innerHTML += `<div style="text-align:right"><b>You:</b> ${esc(q)}</div>`;
    input.value = "";
    setTimeout(()=>{
        let ans = "Keeping your fixed costs at Rs 62,000 means consistent delivery hours during meal peaks will comfortably cover your targets. Keep pushing!";
        if(q.toLowerCase().includes("camera")) ans = "Your camera fund target is Rs 90,000. Check ikman or local used camera shops in Colombo for reliable bodies like Canon 1300D or GoPro units.";
        if(q.toLowerCase().includes("loan") || q.toLowerCase().includes("rent")) ans = "Your fixed expenses total Rs 62,000. Try earning this in your first 10-12 days of delivery so the rest of the month goes straight to your camera fund and USD savings!";
        log.innerHTML += `<div style="background:var(--card); border:1px solid var(--line); padding:10px; border-radius:12px"><b>Gemini:</b> ${ans}</div>`;
        log.scrollTop = log.scrollHeight;
    }, 400);
}

let myChart = null;
function renderChart(inc, fixed, other){
    const ctx = document.getElementById('repChart');
    if(!ctx) return;
    if(myChart) myChart.destroy();
    myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Income', 'Fixed Costs', 'Other Exp'],
            datasets: [{
                data: [inc, fixed, other],
                backgroundColor: ['#1F7A45', '#C2452B', '#0F5257'],
                borderRadius: 8
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: '#E1E7E2' }, ticks: { color: '#64767B' } },
                x: { grid: { display: false }, ticks: { color: '#64767B' } }
            }
        }
    });
}

// Categories Tab
function cats(){
    let h="<h1>Categories</h1><p class='mut'>Income sources and expense types.</p>";
    [["i","Income sources"],["e","Expenses"]].forEach(([t,n])=>{
        h+=`<h2>${n}</h2><div class="chips">`+
        S.cats.filter(c=>c.t==t).map(c=>`<span class="chip">${esc(c.name)}<button data-act="delcat" data-id="${c.id}" aria-label="Remove">✕</button></span>`).join("")+
        `</div><div class="add"><input id="ci-${t}" placeholder="Add ${t=="i"?"income source":"expense type"}"><button class="btn sm" data-act="addcat" data-t="${t}">Add</button></div>`;
    });
    return h;
}

function render(){
    $("#v").innerHTML = {
        home, goals, wallets: wal, reports, ai: aiTab, cats
    }[tab]();
    document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("on", b.dataset.tab==tab));
    window.scrollTo(0,0);
}

function sheet(title,body,ok){
    $("#sb").innerHTML=`<h2 style="margin-top:0">${title}</h2>${body}<div class="row" style="margin-top:12px"><button class="btn ghost full" id="cx">Cancel</button><button class="btn full" id="ok">Save</button></div>`;
    $("#sheet").classList.add("open");
    $("#cx").onclick=close;
    $("#ok").onclick=()=>{ if(ok()!==false){ close(); save(); render(); } }
}
const close=()=>$("#sheet").classList.remove("open");
const opts=a=>a.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.currency || 'LKR'})</option>`).join("");
const val=n=>$("#sb [name="+n+"]").value;

// Transaction Sheet Modal
function txSheet(){
    let ty="e";
    sheet("Add Transaction",`
        <div class="seg"><button data-t="i">Income</button><button data-t="e" class="on">Expense</button><button data-t="t">Transfer</button></div>
        <label>Amount</label><input name="a" type="number" inputmode="decimal" min="0" step="any">
        <label>Wallet</label><select name="w">${opts(S.wallets)}</select>
        <div id="to" hidden><label>To wallet</label><select name="w2">${opts(S.wallets)}</select></div>
        <div id="cw"><label>Category</label><select name="c"></select></div>
        <label>Date</label><input name="d" type="date" value="${td()}">
        <label>Note</label><input name="n" placeholder="Optional">
    `,()=>{
        const a=parseFloat(val("a")); if(!(a>0)){alert("Enter amount above 0");return false;}
        const w=val("w"), w2=val("w2"); if(ty=="t"&&w==w2){alert("Pick different wallets");return false;}
        const c=S.cats.find(x=>x.id==val("c"));
        S.tx.push({id:uid(), t:ty, a, w, w2:ty=="t"?w2:null, c:c&&c.id, cn:ty=="t"?"":c?c.name:"", d:val("d")||td(), n:val("n")});
    });
    const set=t=>{
        ty=t; document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));
        $("#to").hidden=t!="t"; $("#cw").hidden=t=="t";
        $("#sb [name=c]").innerHTML=opts(S.cats.filter(c=>c.t==t));
    };
    document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>set(b.dataset.t));
    set("e");
}

document.addEventListener("click",e=>{
    const b=e.target.closest("[data-tab],[data-act]");
    if(!b) return;
    if(b.dataset.tab){ tab=b.dataset.tab; armed=null; return render(); }
    const a=b.dataset.act, i=b.dataset.id;
    
    if(a=="tx") txSheet();
    if(a=="deltx"){ S.tx=S.tx.filter(t=>t.id!=i); save(); render(); }
    
    if(a=="fund"){
        const g=S.goals.find(x=>x.id==i);
        sheet("Add to "+esc(g.name),`
            <label>Amount (LKR)</label><input name="a" type="number" inputmode="decimal" min="0" step="any">
            <label>Take from Wallet</label><select name="w">${opts(S.wallets)}<option value="">No wallet (external)</option></select>
            <label>Date</label><input name="d" type="date" value="${td()}">
        `,()=>{
            const a=parseFloat(val("a")); if(!(a>0)){alert("Enter amount above 0");return false;}
            g.c.push({id:uid(), a, w:val("w"), d:val("d")||td()});
        });
    }
    if(a=="delc"){
        const g=S.goals.find(x=>x.id==i);
        g.c=g.c.filter(x=>x.id!=b.dataset.c);
        save(); render();
    }
    if(a=="goal"){
        sheet("New Target",`
            <label>Name</label><input name="n" placeholder="e.g. Second-hand Camera">
            <label>Target Amount (Rs)</label><input name="a" type="number" inputmode="decimal">
            <label>Deadline</label><input name="d" type="date" value="${plus(60)}">
        `,()=>{
            const a=parseFloat(val("a")); if(!val("n")||!(a>0)||!val("d")){alert("Fill all fields");return false;}
            S.goals.push({id:uid(), name:val("n"), target:a, due:val("d"), c:[]});
        });
    }
    // Add Wallet Modal
    if(a=="wallet"){
        sheet("New Wallet",`
            <label>Wallet Name</label><input name="n" placeholder="e.g. Sampath NRFC USD">
            <label>Currency</label><select name="cur"><option value="LKR">LKR</option><option value="USD">USD</option></select>
            <label>Opening Balance</label><input name="a" type="number" inputmode="decimal" value="0">
        `,()=>{
            if(!val("n")){alert("Enter name");return false;}
            S.wallets.push({id:uid(), name:val("n"), currency:val("cur"), open:parseFloat(val("a"))||0});
        });
    }
    if(a=="delgoal"||a=="delwal"){
        if(armed!=i){ armed=i; return render(); }
        if(a=="delgoal") S.goals=S.goals.filter(g=>g.id!=i);
        else {
            if(S.wallets.length<2){alert("Keep at least one wallet"); armed=null; return render();}
            S.wallets=S.wallets.filter(w=>w.id!=i);
            S.tx=S.tx.filter(t=>t.w!=i&&t.w2!=i);
        }
        armed=null; save(); render();
    }
    if(a=="addcat"){
        const t=b.dataset.t, v=$("#ci-"+t).value.trim();
        if(v){ S.cats.push({id:uid(), name:v, t}); save(); render(); }
    }
    if(a=="delcat"){ S.cats=S.cats.filter(c=>c.id!=i); save(); render(); }
});

render();
</script>
</body>
</html>
