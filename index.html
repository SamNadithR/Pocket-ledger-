<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger"><meta name="theme-color" content="#0F5257">
<title>Pocket Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4EF;--card:#fff;--ink:#12212A;--mut:#64767B;--acc:#0F5257;--in:#1F7A45;--out:#C2452B;--line:#E1E7E2;--gold:#F4C95D;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1619;--card:#16242A;--ink:#E8F0EC;--mut:#8FA3A7;--acc:#5FC2B4;--in:#6CCB8D;--out:#F58B68;--line:#25373D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1619;--card:#16242A;--ink:#E8F0EC;--mut:#8FA3A7;--acc:#5FC2B4;--in:#6CCB8D;--out:#F58B68;--line:#25373D;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-bottom:110px}
main{max-width:560px;margin:0 auto;padding:18px 16px}
h1,h2,.big{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
h1{font-size:34px;font-weight:800;line-height:1.1}
h2{font-size:19px;font-weight:600;margin:26px 0 10px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(18,33,42,.05)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.in{color:var(--in)}.out{color:var(--out)}
.wallets{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
.wc{flex:0 0 74%;scroll-snap-align:start;border-radius:24px;padding:18px;min-height:136px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.wc .big{font-size:28px;font-weight:800}.wc span{opacity:.85;font-size:14px}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px}
.g{display:flex;gap:14px;align-items:center}.g>div:nth-child(2){flex:1;min-width:0}
.gn{font-weight:600}.gp{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800}
.tx{padding:11px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.x{background:none;border:0;color:var(--mut);font-size:14px;padding:6px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:16px;padding:13px 18px;font-weight:600}
.sm{padding:9px 14px;border-radius:14px;font-size:14px}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.full{width:100%}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:4px 0 12px}
label{font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--card);border-radius:20px;padding:6px 6px 6px 14px;font-size:14px}
.chip button{background:none;border:0;color:var(--mut);padding:0 8px}
.add{display:flex;gap:8px}.add input{margin:0}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--card);border-radius:28px;box-shadow:0 8px 30px rgba(18,33,42,.18);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 4px}
nav button{background:none;border:0;color:var(--mut);padding:10px 0;font-size:13px;font-weight:600}
nav button.on{color:var(--acc)}
nav .plus{justify-self:center;background:var(--acc);color:#fff;border-radius:50%;width:56px;height:56px;font-size:30px;line-height:1;padding:0;margin-top:-30px;box-shadow:0 6px 16px rgba(15,82,87,.4)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
#sheet.open{display:flex}
#sheet>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.seg{display:flex;gap:6px;margin-bottom:14px;background:var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:12px;border:0;background:none;font-weight:600}
.seg button.on{background:var(--card);color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body>
<main id="v"></main>
<nav><button data-tab="home">Home</button><button data-tab="goals">Targets</button><button class="plus" data-act="tx" aria-label="Add transaction">+</button><button data-tab="wallets">Wallets</button><button data-tab="cats">Categories</button></nav>
<div id="sheet"><div id="sb"></div></div>
<script>
const $=s=>document.querySelector(s),K="ledger-v1",WC=["#0F5257","#9A5B0F","#C2452B","#3B4BA6","#5B3F8C"];
const pad=n=>String(n).padStart(2,"0"),dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const td=()=>dstr(new Date()),uid=()=>Math.random().toString(36).slice(2,9);
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>"Rs "+Math.round(n).toLocaleString("en-US");
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.wallets){S={wallets:[{id:uid(),name:"Main",open:0},{id:uid(),name:"Savings",open:0}],
cats:[["Salary","i"],["Delivery","i"],["Rent","e"],["Food and transport","e"],["Mobile","e"],["Loan","e"],["Fuel","e"]].map(x=>({id:uid(),name:x[0],t:x[1]})),
tx:[],goals:[{id:uid(),name:"Insta360 X5",target:150000,due:plus(90),c:[]}]}}
S.goals.forEach(g=>{g.c=g.c||[]});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab="home",armed=null;
const saved=g=>g.c.reduce((s,x)=>s+x.a,0);
const bal=w=>{const W=S.wallets.find(x=>x.id==w);let b=W?W.open:0;
S.tx.forEach(t=>{if(t.t=="i"&&t.w==w)b+=t.a;if(t.t=="e"&&t.w==w)b-=t.a;if(t.t=="t"){if(t.w==w)b-=t.a;if(t.w2==w)b+=t.a}});
S.goals.forEach(g=>g.c.forEach(x=>{if(x.w==w)b-=x.a}));return b};
const wname=id=>(S.wallets.find(w=>w.id==id)||{name:"No wallet"}).name;
const daysLeft=d=>Math.round((new Date(d+"T00:00")-new Date(td()+"T00:00"))/864e5)+1;
function gcard(g,full){const sv=saved(g),rem=Math.max(0,g.target-sv),dl=daysLeft(g.due),per=dl>0?rem/dl:rem,pct=Math.min(100,sv/g.target*100);
const today=g.c.filter(x=>x.d==td()).reduce((s,x)=>s+x.a,0);
let h=`<div class="card"><div class="g"><div class="ring" style="--p:${pct}"><b>${Math.round(pct)}%</b></div><div><div class="gn">${esc(g.name)}</div>
<div class="gp">${rem==0?"Goal reached":fmt(per)+" / day"}</div><div class="mut">${rem==0?"Target fully funded":(dl>0?dl+" day"+(dl>1?"s":"")+" left":"Deadline passed")+" · by "+g.due}</div></div>
<button class="btn sm" data-act="fund" data-id="${g.id}">+ Add</button></div>`;
if(full){h+=`<div class="row" style="margin-top:14px"><span class="mut">${fmt(sv)} of ${fmt(g.target)}</span><span class="mut">Today ${fmt(today)}${rem>0?" / "+fmt(per):""}</span></div><h2 style="font-size:15px;margin:14px 0 4px">Contributions</h2>`+
(g.c.length?g.c.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<div class="tx row"><div>${fmt(x.a)}<div class="mut">${x.d} · from ${esc(wname(x.w))}</div></div><button class="x" data-act="delc" data-id="${g.id}" data-c="${x.id}" aria-label="Delete">✕</button></div>`).join(""):`<div class="mut">None yet. Tap Add to put money toward this target.</div>`)+
`<div style="text-align:right"><button class="x" data-act="delgoal" data-id="${g.id}">${armed==g.id?"Tap again to delete":"Remove target"}</button></div>`}
return h+"</div>"}
function home(){const tot=S.wallets.reduce((s,w)=>s+bal(w.id),0);
let h=`<div class="mut">Total balance</div><h1>${fmt(tot)}</h1><div class="wallets">`+S.wallets.map((w,i)=>`<div class="wc" style="background:${WC[i%WC.length]}"><span>${esc(w.name)}</span><div class="big">${fmt(bal(w.id))}</div></div>`).join("")+`</div><h2>Targets</h2>`;
h+=S.goals.length?S.goals.map(g=>gcard(g,false)).join(""):`<div class="mut">No targets yet. Add one in the Targets tab.</div>`;
h+=`<h2>Recent</h2><div class="card">`;
const L=S.tx.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id.localeCompare(a.id)).slice(0,20);
h+=L.length?L.map(t=>`<div class="tx row"><div>${esc(t.t=="t"?"Transfer":t.cn||"Other")}<div class="mut">${t.t=="t"?esc(wname(t.w))+" to "+esc(wname(t.w2)):esc(wname(t.w))} · ${t.d}${t.n?" · "+esc(t.n):""}</div></div>
<div class="row"><b class="${t.t=="i"?"in":t.t=="e"?"out":""}">${t.t=="e"?"-":t.t=="i"?"+":""}${fmt(t.a)}</b><button class="x" data-act="deltx" data-id="${t.id}" aria-label="Delete">✕</button></div></div>`).join(""):`<span class="mut">Nothing yet. Tap + to add income or an expense.</span>`;
return h+"</div>"}
function goals(){return `<h1>Targets</h1><p class="mut">Add money to a target a little at a time. The daily amount updates each time.</p>`+S.goals.map(g=>gcard(g,true)).join("")+`<button class="btn full" data-act="goal">New target</button>`}
function wal(){let h=`<h1>Wallets</h1><p class="mut">Place for each pot of money, like cash or bank.</p>`;
S.wallets.forEach((w,i)=>{h+=`<div class="card row" style="border-left:8px solid ${WC[i%WC.length]}"><div><b>${esc(w.name)}</b><div class="big" style="font-size:22px">${fmt(bal(w.id))}</div></div><button class="x" data-act="delwal" data-id="${w.id}">${armed==w.id?"Tap again (deletes its entries)":"Remove"}</button></div>`});
return h+`<button class="btn full" data-act="wallet">New wallet</button>`}
function cats(){let h="<h1>Categories</h1><p class='mut'>Your income sources and expense types.</p>";
[["i","Income sources"],["e","Expenses"]].forEach(([t,n])=>{h+=`<h2>${n}</h2><div class="chips">`+S.cats.filter(c=>c.t==t).map(c=>`<span class="chip">${esc(c.name)}<button data-act="delcat" data-id="${c.id}" aria-label="Remove ${esc(c.name)}">✕</button></span>`).join("")+`</div><div class="add"><input id="ci-${t}" placeholder="Add ${t=="i"?"income source":"expense type"}"><button class="btn" data-act="addcat" data-t="${t}">Add</button></div>`});return h}
function render(){$("#v").innerHTML={home,goals,wallets:wal,cats}[tab]();
document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab==tab));window.scrollTo(0,0)}
function sheet(title,body,ok){$("#sb").innerHTML=`<h2 style="margin-top:0">${title}</h2>${body}<div class="row" style="margin-top:6px"><button class="btn ghost" id="cx">Cancel</button><button class="btn" id="ok">Save</button></div>`;
$("#sheet").classList.add("open");$("#cx").onclick=close;$("#ok").onclick=()=>{if(ok()!==false){close();save();render()}}}
const close=()=>$("#sheet").classList.remove("open");
const opts=a=>a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
const val=n=>$("#sb [name="+n+"]").value;
function txSheet(){let ty="e";
sheet("Add transaction",`<div class="seg"><button data-t="i">Income</button><button data-t="e" class="on">Expense</button><button data-t="t">Transfer</button></div>
<label>Amount (Rs)</label><input name="a" type="number" inputmode="decimal" min="0" step="any">
<label>Wallet</label><select name="w">${opts(S.wallets)}</select>
<div id="to" hidden><label>To wallet</label><select name="w2">${opts(S.wallets)}</select></div>
<div id="cw"><label>Category</label><select name="c"></select></div>
<label>Date</label><input name="d" type="date" value="${td()}"><label>Note</label><input name="n" placeholder="Optional">`,()=>{
const a=parseFloat(val("a"));if(!(a>0)){alert("Enter an amount above 0");return false}
const w=val("w"),w2=val("w2");if(ty=="t"&&w==w2){alert("Pick two different wallets");return false}
const c=S.cats.find(x=>x.id==val("c"));
S.tx.push({id:uid(),t:ty,a,w,w2:ty=="t"?w2:null,c:c&&c.id,cn:ty=="t"?"":c?c.name:"",d:val("d")||td(),n:val("n")})});
const set=t=>{ty=t;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));
$("#to").hidden=t!="t";$("#cw").hidden=t=="t";$("#sb [name=c]").innerHTML=opts(S.cats.filter(c=>c.t==t))};
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>set(b.dataset.t));set("e")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-act]");if(!b)return;
if(b.dataset.tab){tab=b.dataset.tab;armed=null;return render()}
const a=b.dataset.act,i=b.dataset.id;
if(a=="tx")txSheet();
if(a=="deltx"){S.tx=S.tx.filter(t=>t.id!=i);save();render()}
if(a=="fund"){const g=S.goals.find(x=>x.id==i);sheet("Add to "+esc(g.name),`<label>Amount (Rs)</label><input name="a" type="number" inputmode="decimal" min="0" step="any"><label>Take it from</label><select name="w">${opts(S.wallets)}<option value="">No wallet (just record it)</option></select><label>Date</label><input name="d" type="date" value="${td()}">`,()=>{
const a=parseFloat(val("a"));if(!(a>0)){alert("Enter an amount above 0");return false}g.c.push({id:uid(),a,w:val("w"),d:val("d")||td()})})}
if(a=="delc"){const g=S.goals.find(x=>x.id==i);g.c=g.c.filter(x=>x.id!=b.dataset.c);save();render()}
if(a=="goal")sheet("New target",`<label>Name</label><input name="n" placeholder="e.g. Insta360 X5"><label>Target (Rs)</label><input name="a" type="number" inputmode="decimal"><label>Deadline</label><input name="d" type="date" value="${plus(90)}">`,()=>{
const a=parseFloat(val("a"));if(!val("n")||!(a>0)||!val("d")){alert("Add a name, target and deadline");return false}
S.goals.push({id:uid(),name:val("n"),target:a,due:val("d"),c:[]})});
if(a=="wallet")sheet("New wallet",`<label>Name</label><input name="n" placeholder="e.g. Cash"><label>Opening balance (Rs)</label><input name="a" type="number" inputmode="decimal" value="0">`,()=>{
if(!val("n")){alert("Enter a name");return false}S.wallets.push({id:uid(),name:val("n"),open:parseFloat(val("a"))||0})});
if(a=="delgoal"||a=="delwal"){if(armed!=i){armed=i;return render()}
if(a=="delgoal")S.goals=S.goals.filter(g=>g.id!=i);
else{if(S.wallets.length<2){alert("Keep at least one wallet");armed=null;return render()}
S.wallets=S.wallets.filter(w=>w.id!=i);S.tx=S.tx.filter(t=>t.w!=i&&t.w2!=i);S.goals.forEach(g=>g.c.forEach(x=>{if(x.w==i)x.w=""}))}
armed=null;save();render()}
if(a=="addcat"){const t=b.dataset.t,v=$("#ci-"+t).value.trim();if(v){S.cats.push({id:uid(),name:v,t});save();render()}}
if(a=="delcat"){S.cats=S.cats.filter(c=>c.id!=i);save();render()}});
render();
</script></body></html>
